name: API edge config

on:
  workflow_dispatch:

concurrency:
  group: lapis-api-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify Nginx API config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure pinned SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.LAPIS_UPDATE_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.LAPIS_UPDATE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/lapis-api-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/lapis-api-deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/lapis-api-deploy" > /dev/null

      - name: Install config with rollback guard
        env:
          DEPLOY_HOST: ${{ secrets.LAPIS_UPDATE_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.LAPIS_UPDATE_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          key="$HOME/.ssh/lapis-api-deploy"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          stage="/tmp/lapis-api-edge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.conf"
          ssh_options=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15)
          ssh "${ssh_options[@]}" "$remote" 'id; if docker ps --format "{{.Names}}" >/dev/null 2>&1; then echo docker-access=yes; else echo docker-access=no; fi; if [ -w /opt/lapis-api/source ]; then echo api-source-write=yes; else echo api-source-write=no; fi'
          scp "${ssh_options[@]}" deploy/nginx/lapis-mc-updates.https.conf "$remote:$stage"
          ssh "${ssh_options[@]}" "$remote" "bash -s -- '$stage' '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          suffix="$2"
          if [ "$(id -u)" -eq 0 ]; then
            sudo_cmd=()
          else
            sudo_cmd=(sudo -n)
          fi
          nginx_dump="$(mktemp)"
          cleanup() { rm -f "$stage" "$nginx_dump"; }
          trap cleanup EXIT
          if ! "${sudo_cmd[@]}" nginx -T >"$nginx_dump" 2>&1; then
            cat "$nginx_dump" >&2
            exit 1
          fi
          target="$(awk '
            /^# configuration file / { file=$4; sub(/:$/, "", file) }
            /server_name lapis-mc.ru;/ { print file; exit }
          ' "$nginx_dump")"
          test -n "$target"
          target="$(readlink -f "$target")"
          case "$target" in
            /etc/nginx/*) ;;
            *) echo "Unexpected Nginx config target: $target" >&2; exit 1 ;;
          esac
          backup="${target}.backup-${suffix}"
          "${sudo_cmd[@]}" cp -a "$target" "$backup"
          "${sudo_cmd[@]}" install -o root -g root -m 0644 "$stage" "$target"
          if ! "${sudo_cmd[@]}" nginx -t; then
            "${sudo_cmd[@]}" cp -a "$backup" "$target"
            "${sudo_cmd[@]}" nginx -t
            exit 1
          fi
          "${sudo_cmd[@]}" systemctl reload nginx
          "${sudo_cmd[@]}" nginx -T 2>&1 | grep -q 'client_max_body_size 128m;'
          REMOTE

      - name: Verify public API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 https://lapis-mc.ru/api/healthz
