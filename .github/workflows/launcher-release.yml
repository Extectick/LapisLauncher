name: Launcher release

on:
  workflow_dispatch:
  push:
    tags:
      - "launcher-v*"

concurrency:
  group: launcher-release-stable
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate source and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lapis_test
          POSTGRES_USER: lapis
          POSTGRES_PASSWORD: lapis
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lapis -d lapis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lapis/api prisma:generate

      - name: Build contracts
        run: pnpm --filter @lapis/contracts build

      - name: Build Minecraft core
        run: pnpm --filter @lapis/minecraft-core build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        env:
          DATABASE_URL: postgresql://lapis:lapis@localhost:5433/lapis_test?schema=public
          LAPIS_ACCESS_TOKEN_SECRET: ci-access-secret-with-at-least-32-characters
          LAPIS_REFRESH_TOKEN_PEPPER: ci-refresh-pepper-with-at-least-32-characters
          RUN_DATABASE_TESTS: "1"
        run: pnpm test

  package:
    name: Build signed Windows release
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.previous.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore pinned Velopack CLI
        run: dotnet tool restore

      - name: Read and verify launcher version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content apps/launcher/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Launcher version must use MAJOR.MINOR.PATCH."
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "launcher-v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match launcher version $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore previous release for delta generation
        if: github.ref_type == 'tag'
        id: previous
        shell: pwsh
        run: |
          $outputDirectory = "apps/launcher/release/velopack"
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $currentVersion = [version]"${{ steps.version.outputs.version }}"
          $release = gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName |
            ConvertFrom-Json |
            Where-Object tagName -ne $env:GITHUB_REF_NAME |
            ForEach-Object {
              if ($_.tagName -match '^launcher-v(\d+\.\d+\.\d+)$') {
                [pscustomobject]@{ tagName = $_.tagName; version = [version]$Matches[1] }
              }
            } |
            Sort-Object version -Descending |
            Select-Object -First 1
          if ($release) {
            if ($currentVersion -le $release.version) {
              throw "Version $currentVersion must be newer than published $($release.version)."
            }
            gh release download $release.tagName --pattern "*-full.nupkg" --dir $outputDirectory
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to restore the previous full package."
            }
            "tag=$($release.tagName)" >> $env:GITHUB_OUTPUT
          }

      - name: Generate release notes
        shell: pwsh
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "launcher-release-notes.md"
          $previousTag = "${{ steps.previous.outputs.tag }}"
          if ($previousTag) {
            $notes = git log "$previousTag..HEAD" --pretty=format:"- %s"
          } else {
            $notes = git log -20 --pretty=format:"- %s"
          }
          if (-not $notes) {
            $notes = "Lapis Launcher ${{ steps.version.outputs.version }}"
          }
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8NoBOM
          "VELOPACK_RELEASE_NOTES=$notesPath" >> $env:GITHUB_ENV

      - name: Prepare and validate signing certificate
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_CODE_SIGNING_THUMBPRINT }}
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD) -or
            [string]::IsNullOrWhiteSpace($env:EXPECTED_THUMBPRINT)
          ) {
            throw "Windows Code Signing secrets are incomplete."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "lapis-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:PFX_BASE64))
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificatePath,
            $env:PFX_PASSWORD,
            $flags
          )
          if ($certificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
            throw "Signing certificate thumbprint does not match the protected value."
          }
          "LAPIS_SIGNING_CERTIFICATE=$certificatePath" >> $env:GITHUB_ENV

      - name: Build signed Velopack release
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $env:VELOPACK_SIGN_PARAMS = "/f `"$env:LAPIS_SIGNING_CERTIFICATE`" /p `"$env:PFX_PASSWORD`" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256"
          pnpm package:win:release

      - name: Verify release and signer
        shell: pwsh
        env:
          EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_CODE_SIGNING_THUMBPRINT }}
        run: |
          $releaseDirectory = "apps/launcher/release/velopack"
          $setup = Get-Item "$releaseDirectory/LapisLauncher-stable-Setup.exe"
          if ($setup.Length -gt 150MB) {
            throw "Setup exceeds the 150 MiB release budget: $($setup.Length) bytes."
          }
          $appAsar = Get-Item "apps/launcher/release/electron/win-unpacked/resources/app.asar"
          if ($appAsar.Length -gt 15MB) {
            throw "app.asar exceeds the 15 MiB release budget: $($appAsar.Length) bytes."
          }
          $expectedLocales = @("en-US.pak", "ru.pak")
          $actualLocales = @(
            Get-ChildItem "apps/launcher/release/electron/win-unpacked/locales" -File |
              Select-Object -ExpandProperty Name
          )
          $unexpectedLocales = @($actualLocales | Where-Object { $_ -notin $expectedLocales })
          $missingLocales = @($expectedLocales | Where-Object { $_ -notin $actualLocales })
          if ($unexpectedLocales.Count -or $missingLocales.Count) {
            throw "Unexpected Electron locales. Actual: $($actualLocales -join ', ')."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          $allowedStatuses = @("Valid", "NotTrusted", "UnknownError")
          if ($signature.Status.ToString() -notin $allowedStatuses) {
            throw "Invalid installer signature: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
            throw "Unexpected installer signer."
          }
          $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
          try {
            $chain.ChainPolicy.TrustMode = [Security.Cryptography.X509Certificates.X509ChainTrustMode]::CustomRootTrust
            $chain.ChainPolicy.CustomTrustStore.Add($signature.SignerCertificate) | Out-Null
            $chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::NoCheck
            if (-not $chain.Build($signature.SignerCertificate)) {
              $errors = ($chain.ChainStatus.StatusInformation -join "; ").Trim()
              throw "Installer signer chain validation failed: $errors"
            }
          } finally {
            $chain.Dispose()
          }
          $feed = Get-Content "$releaseDirectory/releases.stable.json" -Raw | ConvertFrom-Json
          $currentVersion = "${{ steps.version.outputs.version }}"
          $currentAssets = @($feed.Assets | Where-Object Version -eq $currentVersion)
          if (-not ($currentAssets | Where-Object Type -eq "Full")) {
            throw "Velopack feed does not contain the current full package."
          }
          $previousTag = "${{ steps.previous.outputs.tag }}"
          if ($previousTag -and -not ($currentAssets | Where-Object Type -eq "Delta")) {
            throw "Velopack feed does not contain a delta package from $previousTag."
          }
          $packages = Get-ChildItem $releaseDirectory -File -Filter "LapisLauncher-$currentVersion-stable-*.nupkg"
          if (-not $packages) {
            throw "Current release packages are missing."
          }
          foreach ($asset in $currentAssets) {
            $packagePath = Join-Path $releaseDirectory $asset.FileName
            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Feed asset is missing locally: $($asset.FileName)."
            }
            $actualSha256 = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
            if ($actualSha256 -ne $asset.SHA256) {
              throw "SHA-256 mismatch for $($asset.FileName)."
            }
          }
          $fullPackage = $packages | Where-Object Name -Like "*-full.nupkg" | Select-Object -First 1
          if (-not $fullPackage -or $fullPackage.Length -gt 145MB) {
            throw "Full package is missing or exceeds the 145 MiB release budget."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LapisLauncher-${{ steps.version.outputs.version }}-Velopack
          path: |
            apps/launcher/release/velopack/LapisLauncher-${{ steps.version.outputs.version }}-stable-*.nupkg
            apps/launcher/release/velopack/LapisLauncher-stable-Setup.exe
            apps/launcher/release/velopack/releases.stable.json
            apps/launcher/release/velopack/assets.stable.json
            apps/launcher/release/velopack/RELEASES-stable
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attest release packages
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/launcher/release/velopack/LapisLauncher-${{ steps.version.outputs.version }}-stable-*.nupkg
            apps/launcher/release/velopack/LapisLauncher-stable-Setup.exe

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = "${{ steps.version.outputs.version }}"
          $releaseDirectory = "apps/launcher/release/velopack"
          $assets = @(
            Get-ChildItem $releaseDirectory -File |
              Where-Object {
                $_.Name -like "LapisLauncher-$version-stable-*.nupkg" -or
                $_.Name -eq "LapisLauncher-stable-Setup.exe" -or
                $_.Name -in @("releases.stable.json", "assets.stable.json", "RELEASES-stable")
              } |
              ForEach-Object FullName
          )
          if (gh release view $tag 2>$null) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --title "Lapis Launcher $version" --notes-file $env:VELOPACK_RELEASE_NOTES
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed."
          }

  deploy:
    name: Publish update feed
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: LapisLauncher-${{ needs.package.outputs.version }}-Velopack
          path: release

      - name: Configure pinned SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.LAPIS_UPDATE_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.LAPIS_UPDATE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/lapis-updates-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/lapis-updates-deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/lapis-updates-deploy" > /dev/null

      - name: Publish packages and metadata atomically
        env:
          DEPLOY_HOST: ${{ secrets.LAPIS_UPDATE_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.LAPIS_UPDATE_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          key="$HOME/.ssh/lapis-updates-deploy"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          target="/var/www/lapis-updates"
          stage="$target/.staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_options=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15)
          ssh "${ssh_options[@]}" "$remote" "install -d -m 755 '$stage'"
          scp "${ssh_options[@]}" release/* "$remote:$stage/"
          ssh "${ssh_options[@]}" "$remote" "set -eu; \
            for file in '$stage'/*.nupkg '$stage'/*-Setup.exe; do [ ! -e \"\$file\" ] || mv -f \"\$file\" '$target/'; done; \
            for name in assets.stable.json RELEASES-stable; do [ ! -e '$stage/'\"\$name\" ] || mv -f '$stage/'\"\$name\" '$target/'\"\$name\"; done; \
            test -f '$stage/releases.stable.json'; \
            mv -f '$stage/releases.stable.json' '$target/releases.stable.json'; \
            rmdir '$stage'"

      - name: Verify public update feed
        env:
          EXPECTED_VERSION: ${{ needs.package.outputs.version }}
          PREVIOUS_TAG: ${{ needs.package.outputs.previous_tag }}
        run: |
          set -euo pipefail
          feed="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 https://lapis-mc.ru/updates/releases.stable.json)"
          printf '%s' "$feed" | jq -e --arg version "$EXPECTED_VERSION" '.Assets | any(.Version == $version and .Type == "Full")'
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '%s' "$feed" | jq -e --arg version "$EXPECTED_VERSION" '.Assets | any(.Version == $version and .Type == "Delta")'
          fi
          printf '%s' "$feed" | jq -r --arg version "$EXPECTED_VERSION" '.Assets[] | select(.Version == $version) | [.FileName, (.Size | tostring)] | @tsv' |
            while IFS=$'\t' read -r file expected_size; do
              [[ "$file" =~ ^LapisLauncher-[0-9]+\.[0-9]+\.[0-9]+-stable-(full|delta)\.nupkg$ ]]
              actual_size="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 --head "https://lapis-mc.ru/updates/$file" |
                tr -d '\r' | awk 'tolower($1) == "content-length:" { print $2 }' | tail -n1)"
              test "$actual_size" = "$expected_size"
              expected_sha256="$(printf '%s' "$feed" | jq -r --arg file "$file" '.Assets[] | select(.FileName == $file) | .SHA256 | ascii_downcase')"
              actual_sha256="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 300 "https://lapis-mc.ru/updates/$file" | sha256sum | awk '{ print $1 }')"
              test "$actual_sha256" = "$expected_sha256"
            done
