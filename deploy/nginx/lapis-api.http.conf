server {
    listen 80;
    listen [::]:80;
    server_name api.lapis-mc.ru;

    client_max_body_size 64k;

    # Admin client-mod uploads are streamed by the API and validated there.
    # Keep the small default for every other endpoint.
    location ~ ^/v1/admin/servers/[^/]+/client-mods$ {
        client_max_body_size 128m;
        limit_req zone=lapis_api_global burst=30 nodelay;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /healthz {
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location = /v1/auth/login {
        limit_req zone=lapis_api_auth burst=10 nodelay;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location = /v1/auth/register {
        limit_req zone=lapis_api_auth burst=5 nodelay;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location / {
        limit_req zone=lapis_api_global burst=30 nodelay;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }
}
