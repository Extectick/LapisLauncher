server {
    listen 127.0.0.1:8443 ssl;
    server_name lapis-mc.ru;

    ssl_certificate /etc/letsencrypt/live/lapis-mc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lapis-mc.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;

    # Temporary production API path until api.lapis-mc.ru is published in DNS.
    # The rewrite removes /api while preserving the rest of the request URI.
    location = /api {
        return 308 /api/;
    }

    location = /api/v1/auth/login {
        limit_req zone=lapis_api_auth burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location = /api/v1/auth/register {
        limit_req zone=lapis_api_auth burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location /api/ {
        limit_req zone=lapis_api_global burst=30 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location = /updates/latest.yml {
        alias /var/www/lapis-updates/latest.yml;
        default_type application/x-yaml;
        add_header Cache-Control "no-store" always;
    }

    location = /updates/releases.stable.json {
        alias /var/www/lapis-updates/releases.stable.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /updates/assets.stable.json {
        alias /var/www/lapis-updates/assets.stable.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /updates/RELEASES-stable {
        alias /var/www/lapis-updates/RELEASES-stable;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location /updates/ {
        alias /var/www/lapis-updates/;
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        return 404;
    }
}
