server {
    listen 80;
    listen [::]:80;
    server_name api.lapis-mc.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Public TLS is multiplexed by HAProxy on :443 and forwarded by SNI.
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name api.lapis-mc.ru;

    ssl_certificate /etc/letsencrypt/live/api.lapis-mc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lapis-mc.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LapisApiTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 64k;

    location = /healthz {
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location = /v1/auth/login {
        limit_req zone=lapis_api_auth burst=10 nodelay;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location = /v1/auth/register {
        limit_req zone=lapis_api_auth burst=5 nodelay;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }

    location / {
        limit_req zone=lapis_api_global burst=30 nodelay;
        include /etc/nginx/snippets/lapis-api-proxy.conf;
    }
}
